name: Update GA4 Monthly Stats

on:
  workflow_dispatch:

  # GitHub Actions cron uses UTC.
  # 18:00 UTC = 02:00 the next day in Taiwan (UTC+8).
  # The Python script itself checks whether the Taiwan date is the 1st.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update-ga4-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data google-auth

      - name: Export previous month GA4 data
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS: ${{ secrets.GA4_CREDENTIALS }}
        run: python scripts/update_ga4_stats.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- stats-data.json; then
            echo "No stats-data.json changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats-data.json
          git commit -m "Update GA4 monthly statistics"
          git push
